[server]
http_addr = 127.0.0.1
http_port = 3002
# root_url interpolates %(domain)s, which defaults to `localhost`. Left unset,
# every absolute link and redirect Grafana emits points at localhost - which
# works from the host and breaks for anyone reaching it through the proxy.
domain = mmd-ai.ir
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[security]
allow_embedding = true
cookie_secure = true

[auth]
# The login form is ON. Grafana used to be reachable by anyone who got past
# nginx with an MMD admin session, with no credential of its own - two
# different systems' idea of "administrator" silently collapsed into one.
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
# OFF. This was the whole exposure: with it enabled, any request that reached
# Grafana was already a Viewer.
enabled = false

[users]
viewers_can_edit = false
